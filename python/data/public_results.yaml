        - {maker: OmniVision, part: OV7251, count: 2, device: Snapdragon Flight, src: dataset, via: "UZH-FPV paper, Delmerico et al. 2019", url: "https://rpg.ifi.uzh.ch/docs/ICRA19_Delmerico.pdf"}
      imus:
        - {maker: TDK InvenSense, part: MPU-6500, device: iniVation mDAVIS346, src: maker, via: iniVation IMU docs, url: "https://docs.inivation.com/hardware/hardware-advanced-usage/imu.html", note: "named for the DAVIS346; the mini version is not stated"}
        - {maker: TDK InvenSense, part: MPU-9250, device: Snapdragon Flight, src: maker, via: "Qualcomm ATLFlight firmware config (mpu9250 driver)", url: "https://github.com/ATLFlight/Firmware/blob/eagle_drone_1.2_cs_0/cmake/configs/qurt_sdflight_default.cmake"}
