  realsense-d435i:
    group: cameras
    key: realsense-d435i
    title: RealSense D435i
    description: Depth camera with a global-shutter infrared stereo pair, a rolling-shutter RGB camera and a 6-axis IMU, calibrated with MVIS as RGB + IMU on three AprilGrid recordings.
    lead: Depth camera from RealSense with a 50 mm global-shutter infrared stereo pair, a rolling-shutter RGB camera and a 6-axis IMU. Three hand-held recordings in front of an AprilGrid, each solved as RGB + IMU with the rolling-shutter readout estimated.
    demo: {from: "realsense-d435i_small", note: "The 3D scene MVIS recovered from the first recording."}
    run_labels: [Recording 1, Recording 2, Recording 3]
    card: {name: "D435i", maker: RealSense, tags: [Rolling shutter, 1 camera, 200 Hz IMU]}
    hardware:
      - [Maker, "RealSense (formerly Intel RealSense)", Maker]
      - [Shutter, "Global on the infrared pair, rolling on the RGB camera", Maker]
      - [Infrared pair, "87° × 58° depth field of view; not used here", Maker]
      - [RGB camera, "2 MP, 69° × 42°, up to 1920×1080 at 30 fps; recorded here at 640×480, 30 Hz, exposure fixed at 3 ms", Maker]
      - [IMU, "Bosch BMI055; gyro and accelerometer at 200 Hz in these recordings, accelerometer resampled onto the gyro stamps", Measured]
      - [Link, "USB-C 3.1 Gen 1; 90 × 25 × 25 mm", Maker]
    dataset:
      - [Recordings, "3 recordings, 80, 67.7 and 77 s, hand-held. About 2,000 to 2,400 RGB frames each, IMU at 200 Hz"]
      - [Format, "EuRoC mav0: RGB PNG and IMU CSV"]
      - [Board, "AprilGrid, 6×6 tags of 88 mm, spacing 0.3"]
      - [Exposure, "Fixed, 3 ms; gain fixed after a short warm-up; white balance fixed"]
      - [Data, "Not hosted"]
    method: "RGB camera with the IMU in one solve per recording, as a rolling-shutter camera with the readout time estimated. Pinhole camera with radial-tangential distortion, seeded from a single-camera solve of the same recording and left free; the camera time offset, IMU scale and misalignment and the gyro-to-accel offset t_ga estimated. The board shape is estimated per corner. IMU noise is the MVIS default, since no measured values exist for this unit. Solved 2026-11-14."
    limits:
      - "The three recordings agree on the time offset (6.00 to 6.12 ms), the readout time (32.5 ms) and the lever arm across the image (within 0.4 and 1.4 mm), but not along the optical axis: z is 14.7 to 20.4 mm, against 11.3 mm in the RealSense SDK's design values. All three recordings turn the camera little about the two axes across the image, which is what makes that distance observable. Holding z at the SDK value fits nearly as well (within about 2 σ), so the SDK value is the safer choice for now."
      - "The tag size, 88 mm, is the stated size of the printed board, and it scales every lever arm."
      - "The board is not flat: its corners lie up to about 6 mm out of plane, the same shape in every recording."
      - "The camera stores no IMU correction, so the IMU scale and bias values are those of the raw sensor."
    header:
      type: "Depth camera: global-shutter infrared stereo, rolling-shutter RGB and a 6-axis IMU"
      maker: {name: RealSense, url: "https://www.realsenseai.com/products/depth-camera-d435i/"}
      links: {product: "https://www.realsenseai.com/products/depth-camera-d435i/", product_label: "RealSense product page", more: [{label: SDK, url: "https://github.com/realsenseai/librealsense"}]}
      image: {kind: photo, file: realsense-d435i.jpg, alt: "RealSense D435i depth camera, front view", credit: "Photo: RealSense, D435i product page", url: "https://www.realsenseai.com/products/depth-camera-d435i/"}
      foot: "Maker values checked 2026-11-14 · 3 recordings, 67.7 to 80 s"
      key_specs:
        cameras: {v: "640 × 480 here: RGB", tag: measured}
        shutter: {v: "Rolling (RGB)", tag: maker, src: "https://www.realsenseai.com/products/depth-camera-d435i/"}
        fov: {auto: fov, also: {v: "69° × 42° RGB, 87° × 58° depth", tag: maker, src: "https://www.realsenseai.com/products/depth-camera-d435i/"}}
        baseline: {v: "50 mm, infrared pair (not used here)", tag: maker, src: "https://www.realsenseai.com/wp-content/uploads/2026/03/RealSense-D400-Series-Datasheet-Mar-2026.pdf"}
        imu: {v: "BMI055, 200 Hz", tag: measured}
        output: {v: "USB-C, EuRoC mav0", tag: maker, src: "https://www.realsenseai.com/products/depth-camera-d435i/"}
  zed2:
    group: cameras
    key: zed2
    title: Stereolabs ZED 2
    description: Rolling-shutter stereo camera with a 120 mm baseline and a 400 Hz IMU, calibrated with MVIS on the public WHUVID calibration recording.
    lead: Stereo depth camera from Stereolabs with two rolling-shutter cameras 120 mm apart, wide 2.1 mm lenses and a built-in IMU at 400 Hz. This is the camera of the WHUVID driving dataset from Wuhan University; both cameras and the IMU are solved together from the authors' own calibration recording, with the rolling-shutter readout estimated.
    card: {name: "ZED 2", maker: Stereolabs, tags: [Rolling shutter, 2 cameras, 400 Hz IMU]}
    hardware:
      - [Maker, Stereolabs, Maker]
      - [Image sensors, "2 × 4 MP 1/3-inch back-illuminated CMOS, 2 µm pixels", Maker]
      - [Shutter, "Rolling, the two cameras synchronised; readout 14.1 ms (left) and 14.0 ms (right) solved here", Maker]
      - [Lenses, "2.1 mm, 110° × 70° (120° diagonal)", Maker]
      - [Baseline, "120 mm", Maker]
      - [Video modes, "Up to 2208×1242 at 15 fps; 1280×720 at 60, 30 or 15 fps", Maker]
      - [Images in the recording, "2 × 1280×720 grey at 19.7 Hz (the dataset states 30 fps)", Measured]
      - [IMU, "6-axis, 400 Hz on the sheet; 381 Hz in the recording", Measured]
      - [Model, "The dataset names a ZED2. The original ZED 2 rather than the later ZED 2i is inferred from the recording date (December 2020) and the solved focal length", Dataset]
    dataset:
      - [Recordings, "1 camera + IMU recording, 74 s, hand-held in front of the board. 1,457 frames per camera, 29,410 IMU samples"]
      - [Source, "WHUVID dataset (Wuhan University), calibration recording published by the authors"]
      - [Format, "ROS 1 bag. Two IMU samples repeat the one before (same time and values) and are dropped"]
      - [Board, "AprilGrid 6×6, tag 20.8 mm, spacing 0.3"]
      - [Licence, "CC BY 4.0, as stated in the WHUVID paper (Chen et al., Remote Sensing 14(9) 2033, 2022); cite it when you use the recording"]
      - [Data, "__HUB:community/zed2/data/__. The authors' calibration bag, unchanged (myCalibrate.bag, 2.7 GB), with a script that drops the two repeated IMU samples. Recorded by the WHUVID authors"]
      - [Configs and results, "__HUB:community/zed2/__"]
    method: "Both cameras and the IMU together. Camera intrinsics (pinhole with radial-tangential distortion, as in the authors' calibration) start from a camera-only solve and stay free; rolling-shutter readout, camera time offsets, IMU scale and misalignment and the gyro-to-accel offset t_ga are estimated. IMU noise from the authors' IMU file. Solved 2026-11-16."
    limits:
      - "No independent reference. The authors publish a Kalibr calibration from the same recording with a global-shutter camera model; it isn't an independent check."
      - "The time offset is given at the first image row. At mid-image, the time a global-shutter model reports, it is about 7 ms later (+4.5 ms)."
      - "The board is small (about 15 cm), so the image edges are covered less well and the principal point trades with the lens distortion: a Kannala–Brandt model moves it by about 10 px with no change in fit."
      - "The recording runs at 19.7 Hz and the IMU at 381 Hz, below the 30 fps and 400 Hz on the sheet, probably from drops while recording."
    header:
      type: "Stereo depth camera: two rolling-shutter cameras with a 400 Hz IMU"
      maker: {name: Stereolabs, url: "https://www.stereolabs.com/"}
      links: {product: "https://www.stereolabs.com/en-us/products/zed-2", product_label: "Stereolabs product page", more: [{label: WHUVID dataset, url: "https://github.com/SleepEarlyLiveLong/WHUVID"}]}
      image: {kind: photo, file: zed2.jpg, alt: "Stereolabs ZED stereo camera, front view (the current ZED 2i, as on the product page)", credit: "Photo: Stereolabs, ZED 2 product page", url: "https://www.stereolabs.com/en-us/products/zed-2"}
      foot: "Values measured in the WHUVID calibration recording · Maker values from the Stereolabs ZED 2 page, read 2026-11-17"
      key_specs:
        cameras: {v: "2 × 1280×720 in the recording", tag: dataset, src: "https://github.com/SleepEarlyLiveLong/WHUVID"}
        shutter: {v: Rolling, tag: maker, src: "https://www.stereolabs.com/en-us/products/zed-2"}
        fov: {auto: fov, also: {v: "110° × 70°", tag: maker, src: "https://www.stereolabs.com/en-us/products/zed-2"}}
        baseline: {auto: baseline}
        imu: {v: "6-axis, 400 Hz", tag: maker, src: "https://www.stereolabs.com/en-us/products/zed-2"}
        output: {v: "USB 3.0; ROS bag in the dataset", tag: maker, src: "https://www.stereolabs.com/en-us/products/zed-2"}
  looper-insight9:
    group: cameras
    title: LooperRobotics Insight 9
    description: Two global-shutter mono cameras, one rolling-shutter colour camera and a 400 Hz IMU, calibrated with MVIS on 4 chessboard recordings of our own unit and on 10 hand-held and 2 robot-arm recordings.
    lead: Sensor head from Looper Robotics with two global-shutter mono cameras, one rolling-shutter colour camera and a 400 Hz IMU. Our own unit on a chessboard, and the hand-held and robot-arm recordings, are shown separately.
    example: {url: "/benchmark/examples/looper-insight9/", label: "Looper Insight 9"}
    thanks:
      people:
        - {name: Qinrui Yan, role: "COO & Co-Founder, DeepMirror; Head of LooperRobotics", url: "https://www.linkedin.com/in/qinrui-yan-3625aa90"}
        - {name: Junjie Tang, role: DeepMirror, url: "https://www.linkedin.com/in/junjie-tang-271b8033a"}
      note: They collected the hand-held and robot-arm recordings and supported sharing this work openly.
    card: {name: "Insight 9", tags: [Global + rolling shutter, 3 cameras, 400 Hz IMU]}
    demo:
      by_variant:
        - {from: "looper-insight9-chessboard_small", note: "The 3D scene MVIS recovered from chessboard take 04 of our own unit. Everything except the board is blurred."}
        - {from: "looper-insight9-arm_small", note: "The 3D scene MVIS recovered from robot-arm recording 1."}
        - {from: "looper-insight9-arm_small", note: "The 3D scene MVIS recovered from robot-arm recording 1."}
    hardware:
      - [Type, "Spatial AI camera", Maker]
      - [Global-shutter cameras, "2 × 544×640 mono at 20 Hz, hardware-synced stereo", Catalog]
      - [Rolling-shutter camera, "1 × 1088×1920 colour at about 4.3 Hz", Catalog]
      - [Lens, "Wide field of view; pinhole-equidistant fit", Catalog]
      - [IMU, "1 × 400 Hz, with stamps quantized to 2.5 ms", Catalog]
      - [Sensor part numbers, Not recorded, Unknown]
    dataset:
      - [Chessboard, "4 recordings of 36 to 61 s, our own unit: takes 01 to 03 warm (41 to 43 °C), take 04 at 55 °C. This page shows take 04"]
      - [Chessboard data, "__HUB:community/looper-insight9/data/__, takes 01 to 04 (this page shows take 04). Everything except the board is blurred. CC BY-NC 4.0, for the data, clip and figures; commercial use by request"]
      - [Hand-held, "10 of about 66 s, 15.0 GB in all"]
      - [Hand-held data, "__LINK__. CC BY-NC 4.0, for the hand-held data, clip and figures; commercial use by request"]
      - [Robot arm, "2 of about 58 s, same program in both"]
      - [Robot-arm data, "__HUB:community/looper-insight9/data/__. Normal frames. CC BY-NC 4.0, for the data, clip and figures; commercial use by request"]
      - [Board, "Chessboard: 10×7 squares (9×6 inner corners), 43.47 mm, shown on a monitor. Hand-held and robot arm: AprilGrid 6×6, tag 55 mm, spacing 0.3, t36h11"]
      - [Configs and results, "__HUB:community/looper-insight9/__"]
    folder: looper-insight9/
    method: "Camera + IMU with camera intrinsics free, t_ga and the cam2 rolling-shutter readout both estimated. Chessboard recordings of 2026-11-07; hand-held batch of 2026-11-02; robot-arm batch of 2026-11-04."
    limits:
      - No reference exists for these recordings, so the values can't be checked for accuracy.
