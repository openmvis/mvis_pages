# Text for the public openmvis.com sensor pages. Written fresh: no maker-versus-MVIS comparison, internal path, code hash or device id.
# Numbers come from the run named by `key` in the maintainers' sensors.yaml (not in this repo; passed to export_sensors.py by path).
# A demo `from` names the clip; the maintainers' sensors.yaml maps it to the file in the media folder (demo_media) when that name holds a device id.
# Only sensors listed here reach the site.
data_url: https://huggingface.co/datasets/calibench-vi/datasets/tree/main
groups:
  - {id: cameras, title: Tracking modules}
  - {id: head-worn, title: Head-worn cameras}
  - {id: vr, title: VR headsets}
  - {id: panoramic, title: 360° cameras}
# The order below is the order on the site: sidebar and Sensors overview. Every sensor needs a group.
sensors:
  intel-t265:
    group: cameras
    key: intel-t265
    title: Intel RealSense T265
    description: Global-shutter fisheye stereo tracking camera with a BMI055 IMU, calibrated with MVIS on one recording of our rig.
    lead: Tracking camera from Intel with two global-shutter fisheye cameras and a Bosch BMI055 IMU, solved here on its own IMU from one recording of our VI-Rig.
    card: {name: "T265", tags: [Global shutter, 2 cameras, 200 Hz IMU]}
    hardware:
      - [Cameras, "2 × OV9282, 848×800 at 30 Hz", Maker]
      - [Shutter, Global, Maker]
      - [Lens, "Fisheye, about 163°", Maker]
      - [IMU, "Bosch BMI055, gyro at 200 Hz, accel at 62.5 Hz", Measured]
    dataset:
      - [Recording, "VI-Rig, recording 1, 80 s window chosen by motion"]
      - [Format, ROS bag]
      - [Board, "AprilGrid 6×6, tag 88 mm, spacing 0.3, t36h11"]
      - [Configs and results, "__HUB:community/intel-t265/__"]
    folder: virig-4imus-3cams/
    method: "Fisheye stereo plus the T265's own IMU, camera intrinsics free, t_ga estimated, and the shape of the calibration board estimated, since the VI-Rig board isn't perfectly flat: about 4.5 mm peak to peak in this August 2021 recording (see Board shape); later recordings of the same board design, from October 2021, show the same saddle at 10–11 mm. Solved 2026-11-12."
    limits:
      - One recording, with no independent reference on this page. These values show what MVIS solved, not how close they are to the truth.
      - The T265 gyro-to-accel offset isn't a pure time shift. We measured about −6.8 ms at 2–4 Hz and −1.2 ms at 30–40 Hz, so a single t_ga is a compromise that depends on the motion.
    demo: {from: "intel-t265-plain_small", note: "The 3D scene MVIS recovered from recording 1."}
    header:
      type: "Tracking camera: global-shutter fisheye stereo with a Bosch BMI055 IMU"
      maker: {name: Intel RealSense, url: "https://www.intel.com/content/www/us/en/products/sku/192742/intel-realsense-tracking-camera-t265/specifications.html"}
      links: {product: "https://www.intel.com/content/www/us/en/products/sku/192742/intel-realsense-tracking-camera-t265/specifications.html", product_label: "Intel specifications"}
      image: {kind: photo, file: intel-t265.jpg, alt: "Intel RealSense T265, front view", credit: "Photo: Intel, T265 launch press release", url: "https://www.intc.com/news-events/press-releases/detail/97/intel-announces-new-class-of-realsense-stand-alone"}
      foot: "Maker values checked 2026-11-03; Intel lists it as discontinued · 1 recording · CC BY-NC 4.0"
      key_specs:
        cameras: {v: "848 × 800 fisheye stereo", tag: maker, src: "https://www.intel.com/content/www/us/en/products/sku/192742/intel-realsense-tracking-camera-t265/specifications.html"}
        shutter: {v: Global, tag: catalog}
        fov: {auto: fov, also: {v: "163° diagonal", tag: maker, src: "https://www.intel.com/content/www/us/en/products/sku/192742/intel-realsense-tracking-camera-t265/specifications.html"}}
        baseline: {auto: baseline}
        imu: {v: "BMI055, gyro 200 Hz, accel 62.5 Hz", tag: measured}
        output: {v: USB 3, tag: maker, src: "https://www.intel.com/content/www/us/en/products/sku/192742/intel-realsense-tracking-camera-t265/specifications.html"}
  realsense-d455:
    group: cameras
    key: realsense-d455
    title: RealSense D455
    description: Depth camera with a global-shutter infrared stereo pair, a global-shutter RGB camera and a 6-axis IMU, calibrated with MVIS as three cameras + IMU on one chessboard recording.
    lead: Depth camera from RealSense with a 95 mm global-shutter infrared stereo pair, a global-shutter RGB camera and a 6-axis IMU. One hand-held recording in front of a chessboard on a screen, solved as left infrared + right infrared + RGB + IMU.
    demo: {from: "realsense-d455_small", note: "The 3D scene MVIS recovered from this recording."}
    card: {name: "D455", maker: RealSense, tags: [Global shutter, 3 cameras, 400 Hz IMU]}
    hardware:
      - [Maker, "RealSense (formerly Intel RealSense)", Maker]
      - [Camera module, "RealSense Module D450 with the Vision Processor D4", Maker]
      - [Shutter, "Global, on the infrared pair and the RGB camera", Maker]
      - [Infrared pair, "87° × 58° depth field of view, 95 mm baseline; recorded here at 848×480, 30 Hz, both images on one stamp", Maker]
      - [RGB camera, "1 MP, 90° × 65°, up to 1280×800 at 30 fps; recorded here at 848×480, about 33 Hz (30 requested)", Maker]
      - [IMU, "Bosch BMI055 (maker); gyro 400 Hz, accelerometer about 250 Hz in this recording", Measured]
      - [Link, "USB-C; 124 × 29 × 26 mm", Maker]
    dataset:
      - [Recording, "1 recording, 90 s, hand-held. About 2,700 frames per infrared camera, 2,985 RGB frames, 36,417 IMU samples"]
      - [Format, ROS1 bag]
      - [Board, "Chessboard shown on a screen, 10×7 squares (9×6 inner corners), 75 mm squares as measured by the recorder"]
      - [Exposure, "Fixed, about 2 ms on all three cameras; no auto exposure"]
      - [Data, "__HUB:community/realsense-d455/data/__. Everything except the chessboard is blurred. CC BY-NC 4.0, for the data, clip and figures; commercial use by request"]
      - [Configs and results, "__HUB:community/realsense-d455/__"]
    method: "Left infrared, right infrared and RGB cameras with the IMU in one solve, all three treated as global shutter. Pinhole camera with radial-tangential distortion, seeded from three single-camera solves of the same recording and left free; camera time offsets, IMU scale and misalignment and the gyro-to-accel offset t_ga estimated. The board is kept rigid. IMU noise is the MVIS default, since no measured values exist for this unit. Solved 2026-11-13."
    limits:
      - One recording, with no independent reference on this page. These values show what MVIS solved, not how close they are to the truth.
      - "The square size, 75 mm, is the recorder's measurement of the board shown on a screen, and it scales every baseline and lever arm. The solved stereo baseline is about 0.7 % under the 95 mm the maker lists."
      - "The infrared images are the camera's own rectified output, so their distortion is close to zero by construction and the values describe that output, not the bare lens."
      - "The recorder turned the camera's IMU correction off, so the IMU scale and bias values are those of the raw sensor. The accelerometer was resampled onto the gyro's time stamps before the solve."
    header:
      type: "Depth camera: global-shutter infrared stereo and RGB with a 6-axis IMU"
      maker: {name: RealSense, url: "https://www.realsenseai.com/products/real-sense-depth-camera-d455f/"}
      links: {product: "https://www.realsenseai.com/products/real-sense-depth-camera-d455f/", product_label: "RealSense product page", more: [{label: SDK, url: "https://github.com/realsenseai/librealsense"}]}
      image: {kind: photo, file: realsense-d455.jpg, alt: "RealSense D455 depth camera, front view", credit: "Photo: RealSense, D455 product page", url: "https://www.realsenseai.com/products/real-sense-depth-camera-d455f/"}
      foot: "Maker values checked 2026-11-13 · 1 recording, 90 s · CC BY-NC 4.0"
      key_specs:
        cameras: {v: "848 × 480 here: IR stereo + RGB", tag: measured}
        shutter: {v: Global, tag: maker, src: "https://www.realsenseai.com/products/real-sense-depth-camera-d455f/"}
        fov: {auto: fov, also: {v: "87° × 58° depth, 90° × 65° RGB", tag: maker, src: "https://www.realsenseai.com/products/real-sense-depth-camera-d455f/"}}
        baseline: {auto: baseline}
        imu: {v: "BMI055, gyro 400 Hz, accel 250 Hz", tag: measured}
        output: {v: "USB-C, ROS bag", tag: maker, src: "https://www.realsenseai.com/products/real-sense-depth-camera-d455f/"}
